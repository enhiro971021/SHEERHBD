<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="2026年6月27日(土) 15:00から、あとちょっとカフェで開催する、しあちゃんの29歳を肉で祝う会の招待状です。" />
    <meta name="theme-color" content="#f8f5ef" />
    <meta property="og:title" content="SHEER HBD | しあの29を、肉で祝う会" />
    <meta
      property="og:description"
      content="6/1生まれのしあちゃんの29歳を、肉で祝う会。2026年6月27日(土) 15:00から。"
    />
    <meta property="og:image" content="https://enhiro971021.github.io/SHEERHBD/assets/flyer.png" />
    <meta property="og:url" content="https://enhiro971021.github.io/SHEERHBD/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>SHEER HBD | しあの29を、肉で祝う会</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__brand" aria-label="招待状">
          <span class="brand__dot">29</span>
          <span class="brand__text">2026.06.01</span>
        </div>

        <div class="poster-shapes" aria-hidden="true">
          <span class="poster-shape poster-shape--sun"></span>
          <span class="poster-shape poster-shape--bowl"></span>
          <span class="poster-shape poster-shape--plate"></span>
          <span class="poster-shape poster-shape--arch"></span>
          <span class="poster-shape poster-shape--dot"></span>
        </div>
        <div class="birthday-balloons" aria-hidden="true"></div>

        <div class="hero-mark" aria-hidden="true">
          <svg class="tether-layer" preserveAspectRatio="none" focusable="false" aria-hidden="true"></svg>
          <div class="sheer-word">
            <span class="balloon balloon--s">
              <span class="sheer-letter sheer-letter--s">S</span>
            </span>
            <span class="balloon balloon--h">
              <span class="sheer-letter sheer-letter--h">H</span>
            </span>
            <span class="balloon balloon--e">
              <span class="sheer-letter sheer-letter--e">E</span>
            </span>
            <span class="balloon balloon--e-alt">
              <span class="sheer-letter sheer-letter--e sheer-letter--e-alt">E</span>
            </span>
            <span class="balloon balloon--r">
              <span class="sheer-letter sheer-letter--r">R</span>
            </span>
          </div>
          <div class="participant-motifs" aria-hidden="true">
            <img class="participant-motif participant-motif--people" src="assets/motif-people-cutout.png" alt="" />
            <img class="participant-motif participant-motif--cake" src="assets/motif-cake-wine-cutout.png" alt="" />
            <img class="participant-motif participant-motif--meat" src="assets/motif-meat-cutout.png" alt="" />
            <img class="participant-motif participant-motif--crow" src="assets/motif-crow-cutout.png" alt="" />
            <img class="participant-motif participant-motif--panda" src="assets/motif-panda-cutout.png" alt="" />
          </div>
          <span class="hero-mark__caption" aria-label="Happy Birthday">
            <span>H</span><span>a</span><span>p</span><span>p</span><span>y</span><span>B</span><span>i</span><span>r</span><span>t</span><span>h</span><span>d</span><span>a</span><span>y</span>
          </span>
        </div>

        <div class="hero__content">
          <div class="hero__title">
            <p class="kicker">6/1 生まれのしあちゃんへ</p>
            <h1 id="hero-title"><span>しあの29を</span><span>肉で祝う会</span></h1>
          </div>

          <div class="event-card" aria-label="開催概要">
            <div class="event-card__row">
              <span>DATE</span>
              <strong>2026.6.27 Sat</strong>
            </div>
            <div class="event-card__row">
              <span>START</span>
              <strong>15:00-</strong>
            </div>
            <div class="event-card__row event-card__row--wide">
              <span>PLACE</span>
              <strong>あとちょっとカフェ 五反田</strong>
            </div>
            <a class="event-card__row event-card__row--contact" href="https://www.instagram.com/enhiro__/" target="_blank" rel="noreferrer">
              <span>CONTACT</span>
              <strong>@enhiro__</strong>
            </a>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js?v=sheerhbd-2"></script>
  </body>
</html>
